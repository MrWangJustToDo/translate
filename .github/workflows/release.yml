name: Release to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate WXT types (extension .wxt)
        # --ignore-scripts skips the extension postinstall ("wxt prepare"), so
        # ./.wxt/tsconfig.json is never generated. Required for the extension
        # typecheck (tsconfig extends ./.wxt/tsconfig.json) and for the
        # playground build (vite 8 oxc tsconfig auto-discovery loads the root
        # tsconfig's references, including packages/extension).
        run: pnpm --filter @my-agent/extension exec wxt prepare

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Publish to npm
        # Topological order: core → app → node → server → cli.
        # `@my-agent/cli` keeps bare imports of its workspace siblings in the
        # bundle, so every runtime dependency must be on the registry first.
        run: pnpm run publish:only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
